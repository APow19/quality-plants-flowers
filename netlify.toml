# NOTE: www/https canonicalisation is NOT handled here. Netlify's own
# Domain management settings already redirect apex<->www at the platform
# level for this site, and that takes priority as currently configured —
# adding host-level redirects here that assume the opposite direction
# created an infinite www<->apex redirect loop that took the whole site
# down. If www/https canonicalisation needs to change, do it in the
# Netlify dashboard (Domain management > primary domain), not here.

# Pretty-URL trailing slash — keep one canonical form per service page.
[[redirects]]
  from = "/weddings"
  to = "/weddings/"
  status = 301

